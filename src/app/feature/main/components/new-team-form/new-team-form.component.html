<form [formGroup]="teamForm" (ngSubmit)="onCreateNewTeam()" class="flex flex-col gap-4 min-w-full">
  <div class="flex flex-col gap-1 mb-2">
    <input
      pInputText
      type="text"
      id="teamName"
      formControlName="teamName"
      placeholder="{{ 'teamForm.teamName' | translate }}"
      class="rounded-xl! border-2! border-blue-200! px-4! py-3! bg-white/95! 
             focus:border-blue-400! focus:ring-2! focus:ring-blue-200! 
             transition-all! duration-200! shadow-sm!"
    />
    <label class="pl-2 font-semibold text-gray-700" for="teamName">
      {{ 'teamForm.teamName' | translate }}
    </label>

    <label class="pl-2 font-semibold text-gray-700 mt-4" for="maxMembers">
      {{ 'teamForm.maxMembers' | translate }}
    </label>
    <p class="text-xs text-gray-600 pl-2 mb-1">
      {{ 'teamForm.teamMembersDescription' | translate }}
    </p>

    <input
      pInputNumber
      type="number"
      id="maxMembers"
      formControlName="maxMembers"
      class="rounded-xl! border-2! border-green-200! px-4! py-3! bg-white/95! 
             w-32! text-center! focus:border-green-400! focus:ring-2! 
             focus:ring-green-200! transition-all! duration-200! shadow-sm!"
      [min]="1"
      [max]="12"
      [value]="6"
    />
  </div>
  <div class="flex justify-end gap-4 mt-6">
    <p-button
      label="{{ 'pokedexPage.cancel' | translate }}"
      severity="secondary"
      (click)="onCancel()"
      styleClass="px-6"
    ></p-button>
    <button
      pButton
      type="submit"
      severity="primary"
      styleClass="px-6"
      [disabled]="teamForm.invalid"
    >
      {{ 'pokedexPage.add' | translate }}
    </button>
  </div>
</form>
